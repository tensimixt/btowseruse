# .github/workflows/docker-build-push.yml

name: Build and Push Docker Image

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ main ]
    # Optionally, trigger only if files in the controller directory change:
    # paths:
    #  - \'browser_use_controller/**\'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Option 1: Login to Docker Hub
      # Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets configured in GitHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Option 2: Login to GitHub Container Registry (ghcr.io)
      # Requires no extra secrets if using the default GITHUB_TOKEN
      # - name: Login to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./browser_use_controller # Path to the directory containing the Dockerfile
          file: ./browser_use_controller/Dockerfile
          push: true
          # Replace with your desired image name and tag
          # Example for Docker Hub:
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/browser-use-controller:latest
          # Example for GitHub Container Registry:
          # tags: ghcr.io/${{ github.repository_owner }}/browser-use-controller:latest
          # Add other tags like git sha if needed: tags: user/app:latest,user/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

